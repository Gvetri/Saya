# racks/android.conf — the knives for building APKs.
# Sourced by scripts/unpack.sh: the shell is the parser, so keep it to declarations.
# Order matters: sdkman -> temurin-21 -> android-cli -> maestro (the SDK needs a JDK on PATH).
knives=(sdkman temurin-21 android-cli maestro)

# Anything a knife needs, declared here rather than buried in the script.
temurin_version="21.0.12-tem"
android_packages=(platform-tools "platforms;android-35" "build-tools;35.0.0")
